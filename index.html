<html>
<head>
  <meta charset="UTF-8">
  <title>Personal Web - Rosi Rahmawati</title>
  <style>
    body {
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f5f7fa; /* background lembut */
      color: #333;
      text-align: center;
    }

    .profile-pic {
      width: 160px;
      height: 160px;
      border-radius: 50%;
      object-fit: cover;
      margin: 20px 0;
      border: 3px solid #0066cc;
    }

    h1 {
      margin: 10px 0 5px 0;
      color: #0066cc;
    }
    h2 {
      margin: 5px 0;
      font-size: 18px;
      font-weight: normal;
      color: #444;
    }
    p.info {
      margin: 5px 0;
      font-size: 16px;
      color: #555;
    }

    .social-icons {
      margin: 20px 0;
    }
    .social-icons a {
      display: inline-block;
      margin: 0 10px;
    }
    .social-icons img {
      width: 45px;
      height: 45px;
      border-radius: 50%;
      background: #fff;
      padding: 8px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.2);
      transition: transform 0.2s, background 0.2s;
    }
    .social-icons img:hover {
      transform: scale(1.2);
      background: #eee;
    }

    footer {
      margin-top: 20px;
      font-size: 14px;
      color: #555;
    }
    .datetime {
      margin-top: 8px;
      font-size: 13px;
      color: #888;
    }
  </style>
</head>
<body>

  <img src="WhatsApp Image 2025-09-27 at 12.45.35_0c480598.jpg" alt="Foto Profil" class="profile-pic">

  <h1>Rosi Rahmawati</h1>
  <h2> S1 Sistem Informasi</h2>
  <p class="info">Fakultas Rekayasa Industri - Telkom University</p>
  <p class="info">Angkatan 2024</p>

  <div class="social-icons">
    <a href="https://rosirahmawati.github.io" target="_self">
      <img src="https://cdn-icons-png.flaticon.com/512/733/733553.png" alt="GitHub">
    </a>
    <a href="https://www.instagram.com/rosirhmwt" target="_blank">
      <img src="https://cdn-icons-png.flaticon.com/512/174/174855.png" alt="Instagram">
    </a>
    <a href="https://telkomuniversity.ac.id" target="_blank">
      <img src="" alt="Telkom University">
    </a>
  </div>

  <footer>
    <p>© 2025 Rosi Rahmawati | Dibuat dengan HTML & CSS</p>
    <p class="datetime">Tanggal: 27 September 2025 | Time: 12:00 WIB</p>
  </footer>

</body>
</html>
